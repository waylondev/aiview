<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIView Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        'bg-dark': '#0F172A',
                        'bg-card': '#1E293B',
                        'bg-hover': '#334155',
                        'text-primary': '#F1F5F9',
                        'text-secondary': '#94A3B8',
                        'border-dark': '#334155',
                        'success': '#10B981',
                        'danger': '#EF4444',
                        'warning': '#F59E0B',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bg-dark text-text-primary min-h-screen">
    <!-- Top Navigation Bar -->
    <nav class="bg-bg-card border-b border-border-dark sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📊</span>
                    <h1 class="text-xl font-bold text-primary">AIView Dashboard</h1>
                </div>
                <button id="refresh-all-btn" class="flex items-center gap-2 px-4 py-2 bg-primary hover:bg-blue-600 text-white rounded-lg transition-colors duration-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>刷新</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Platform Status Cards Section -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-text-secondary">平台状态</h2>
            <div id="platforms-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <div class="col-span-full text-center py-8 text-text-secondary">加载中...</div>
            </div>
        </section>

        <!-- Real-time Hot Search List Section -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-text-secondary">实时热搜</h2>
            <div class="bg-bg-card rounded-xl border border-border-dark overflow-hidden">
                <div id="hot-search-container" class="max-h-96 overflow-y-auto">
                    <div class="text-center py-8 text-text-secondary">加载中...</div>
                </div>
            </div>
        </section>

        <!-- Trend Chart Section -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-text-secondary">数据趋势</h2>
            <div class="bg-bg-card rounded-xl border border-border-dark p-6">
                <div class="chart-controls flex flex-wrap gap-3 mb-6">
                    <select id="platform-select" class="bg-bg-dark border border-border-dark text-text-primary rounded-lg px-4 py-2 focus:outline-none focus:border-primary">
                        <option value="bilibili">Bilibili</option>
                        <option value="douyin">抖音</option>
                        <option value="weibo">微博</option>
                        <option value="kuaishou">快手</option>
                        <option value="xiaohongshu">小红书</option>
                        <option value="zhihu">知乎</option>
                    </select>
                    <select id="type-select" class="bg-bg-dark border border-border-dark text-text-primary rounded-lg px-4 py-2 focus:outline-none focus:border-primary">
                        <option value="hot">热门</option>
                        <option value="search">搜索</option>
                        <option value="video">视频</option>
                    </select>
                    <select id="days-select" class="bg-bg-dark border border-border-dark text-text-primary rounded-lg px-4 py-2 focus:outline-none focus:border-primary">
                        <option value="7">7天</option>
                        <option value="14">14天</option>
                        <option value="30">30天</option>
                    </select>
                    <button id="refresh-trend" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white rounded-lg transition-colors duration-200">刷新</button>
                </div>
                <div class="chart-wrapper relative h-80">
                    <canvas id="trend-chart"></canvas>
                </div>
                <div id="trend-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
            </div>
        </section>

        <!-- Schedule Section -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-text-secondary">任务调度</h2>
            <div class="bg-bg-card rounded-xl border border-border-dark overflow-hidden">
                <div id="schedule-container">
                    <div class="text-center py-8 text-text-secondary">加载中...</div>
                </div>
            </div>
        </section>

        <!-- History Section -->
        <section class="mb-8">
            <h2 class="text-lg font-semibold mb-4 text-text-secondary">历史记录</h2>
            <div class="bg-bg-card rounded-xl border border-border-dark overflow-hidden">
                <div class="p-4 border-b border-border-dark flex items-center gap-3">
                    <select id="history-limit" class="bg-bg-dark border border-border-dark text-text-primary rounded-lg px-4 py-2 focus:outline-none focus:border-primary">
                        <option value="20">20条</option>
                        <option value="50" selected>50条</option>
                        <option value="100">100条</option>
                    </select>
                    <button id="refresh-history" class="px-4 py-2 bg-primary hover:bg-blue-600 text-white rounded-lg transition-colors duration-200">刷新</button>
                </div>
                <div id="history-container">
                    <div class="text-center py-8 text-text-secondary">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Status Bar -->
    <footer class="bg-bg-card border-t border-border-dark py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-text-secondary">
                <span>AIView Dashboard v1.0 | 数据每30秒自动刷新</span>
                <span id="last-update-time">最后更新: --</span>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
